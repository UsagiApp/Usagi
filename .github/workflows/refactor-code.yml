name: Refactor code (for PRs, if needed)

on:
    pull_request_target:
        paths:
            - 'app/src/main/kotlin/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

env:
    SIGNER_USERNAME: YakaBot
    SIGNER_EMAIL: yakateam@proton.me

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository 🌏
                uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
                with:
                    fetch-depth: 0
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}
                    token: ${{ secrets.GITHUB_TOKEN }}

            -   name: Set up Java environment 🔧
                uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.2.0
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Set up Gradle environment 📦
                uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
                with:
                    gradle-version: '9.1.0'

            -   name: Setup Android SDK 🚀
                uses: android-actions/setup-android@v4

            -   name: Run spotless tasks 🚀
                run: ./gradlew spotlessApply --rerun-tasks
                continue-on-error: true

            -   name: Commit & Push changes
                uses: stefanzweifel/git-auto-commit-action@v7
                with:
                    commit_message: "chore: Refactor code using spotless"
                    file_pattern: '.github/summary.yaml'
                    commit_user_name: ${{ env.SIGNER_USERNAME }}
                    commit_user_email: ${{ env.SIGNER_EMAIL }}
