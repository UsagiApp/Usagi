name: Check & Test latest commit

on:
    push:
        branches:
            - devel

permissions:
    contents: read

jobs:
    check-and-build:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            -   name: Checkout repository 🌏
                uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2

            -   name: Set up Java enviroment 🔧
                uses: actions/setup-java@d0e6e4dbf773b98efde945f446d2099b2c0d8fd2 # v5.2.0
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Set up Gradle enviroment 📦
                uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
                with:
                    gradle-version: '9.1.0'

            -   name: Build release app 🚀
                run: ./gradlew assembleRelease --rerun-tasks
