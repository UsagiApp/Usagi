name: Check & Test latest commit

on:
    push:
        branches:
            - devel

permissions:
    contents: read

jobs:
    check-and-build:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            -   name: Checkout repository 🌏
                uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2

            -   name: Set up Java enviroment 🔧
                uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.2.0
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Set up Gradle enviroment 📦
                uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
                with:
                    gradle-version: '9.1.0'

            -   name: Build release app 🚀
                run: ./gradlew assembleRelease --rerun-tasks
