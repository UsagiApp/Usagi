name: Check & Test latest commit

on:
    push:
        branches:
            - devel

jobs:
    check-and-build:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            -   name: Checkout repository 🌏
                uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2

            -   name: Set up Java enviroment 🔧
                uses: actions/setup-java@b622de1dfa918ecc0ab28f40cd42e3c3752cd6c5 # v5.2.0
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Set up Gradle enviroment 📦
                uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
                with:
                    gradle-version: '9.1.0'

            -   name: Build release app 🚀
                run: ./gradlew assembleRelease --rerun-tasks
