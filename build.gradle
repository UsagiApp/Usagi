import org.draken.serialization.plugin.SerializationPlugin

buildscript {
	dependencies {
		classpath libs.usagi.serialization.plugin
	}
}

plugins {
	alias(libs.plugins.android.application) apply false
	alias(libs.plugins.android.library) apply false
	alias(libs.plugins.kotlin) apply false
	alias(libs.plugins.hilt) apply false
	alias(libs.plugins.ksp) apply false
	alias(libs.plugins.room) apply false
	alias(libs.plugins.kotlinx.serizliation) apply false
	alias(libs.plugins.spotless)
//	alias(libs.plugins.decoroutinator) apply false
}

apply plugin: SerializationPlugin

spotless {
	kotlin {
		target '**/src/**/*.kt'
		targetExclude '**/build/**'
		ktlint()
	}
	kotlinGradle {
		target '*.gradle.kts'
		ktlint()
	}
}

subprojects {
	afterEvaluate { project ->
		project.tasks.matching {
			it.name in ['preBuild', 'check', 'assemble', 'build'] || it.name.startsWith('compile')
		}.configureEach {
			dependsOn(rootProject.tasks.named('spotlessApply'))
		}
	}
}

tasks.matching {
	it.name in ['check', 'build']
}.configureEach {
	if (it.name != 'spotlessApply') {
		dependsOn(tasks.named('spotlessApply'))
	}
}
